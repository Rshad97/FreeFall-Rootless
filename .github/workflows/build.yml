name: Build Rootless DEB and Sileo Repo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg ffmpeg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install patched iOS SDK
        run: |
          curl -L "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" -o /tmp/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"

      - name: Prepare CC0 Wilhelm Scream
        run: |
          sh ./scripts/fetch-wilhelm-scream.sh
          file layout/Library/FreeFallRootless/FreeFallScream.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bits_per_sample -show_entries format=duration -of default=nw=1 layout/Library/FreeFallRootless/FreeFallScream.wav

      - name: Build FreeFall package
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload FreeFall DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFall-Rootless-DEB
          path: packages/*.deb

      - name: Assemble Rashad Repo
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/sileo-repo"
          rm -rf "$OUT"
          mkdir -p "$OUT/debs"

          FREEFALL_DEB="$(ls -t packages/*.deb | head -n 1)"
          cp "$FREEFALL_DEB" "$OUT/debs/$(basename "$FREEFALL_DEB")"

          echo "Fetching latest NFCCard package from its distribution branch..."
          curl -fsSL --retry 3             "https://raw.githubusercontent.com/Rshad97/NFCCard/gh-pages/Packages"             -o "$RUNNER_TEMP/NFCCard-Packages"

          NFC_FILENAME="$(awk '/^Filename:/{print $2; exit}' "$RUNNER_TEMP/NFCCard-Packages")"
          test -n "$NFC_FILENAME"
          NFC_RELATIVE="${NFC_FILENAME#./}"
          NFC_NAME="$(basename "$NFC_RELATIVE")"

          curl -fsSL --retry 3             "https://raw.githubusercontent.com/Rshad97/NFCCard/gh-pages/$NFC_RELATIVE"             -o "$OUT/debs/$NFC_NAME"

          : > "$OUT/Packages"

          for DEB in "$OUT"/debs/*.deb; do
            PKG="$(dpkg-deb -f "$DEB" Package)"
            NAME="$(dpkg-deb -f "$DEB" Name)"
            VERSION="$(dpkg-deb -f "$DEB" Version)"
            ARCH="$(dpkg-deb -f "$DEB" Architecture)"
            DESC="$(dpkg-deb -f "$DEB" Description)"
            MAINTAINER="$(dpkg-deb -f "$DEB" Maintainer)"
            AUTHOR="$(dpkg-deb -f "$DEB" Author 2>/dev/null || true)"
            SECTION="$(dpkg-deb -f "$DEB" Section 2>/dev/null || true)"
            DEPENDS="$(dpkg-deb -f "$DEB" Depends 2>/dev/null || true)"
            CONFLICTS="$(dpkg-deb -f "$DEB" Conflicts 2>/dev/null || true)"
            REPLACES="$(dpkg-deb -f "$DEB" Replaces 2>/dev/null || true)"
            HOMEPAGE="$(dpkg-deb -f "$DEB" Homepage 2>/dev/null || true)"
            ICON="$(dpkg-deb -f "$DEB" Icon 2>/dev/null || true)"
            DEB_NAME="$(basename "$DEB")"
            SIZE="$(stat -f%z "$DEB")"
            MD5="$(md5 -q "$DEB")"
            SHA1="$(shasum -a 1 "$DEB" | awk '{print $1}')"
            SHA256="$(shasum -a 256 "$DEB" | awk '{print $1}')"
            SHA512="$(shasum -a 512 "$DEB" | awk '{print $1}')"

            {
              echo "Package: $PKG"
              echo "Name: $NAME"
              echo "Version: $VERSION"
              echo "Architecture: $ARCH"
              echo "Description: $DESC"
              echo "Maintainer: $MAINTAINER"
              [ -n "$AUTHOR" ] && echo "Author: $AUTHOR"
              [ -n "$SECTION" ] && echo "Section: $SECTION"
              [ -n "$DEPENDS" ] && echo "Depends: $DEPENDS"
              [ -n "$CONFLICTS" ] && echo "Conflicts: $CONFLICTS"
              [ -n "$REPLACES" ] && echo "Replaces: $REPLACES"
              [ -n "$HOMEPAGE" ] && echo "Homepage: $HOMEPAGE"
              [ -n "$ICON" ] && echo "Icon: $ICON"
              echo "Filename: ./debs/$DEB_NAME"
              echo "Size: $SIZE"
              echo "MD5sum: $MD5"
              echo "SHA1: $SHA1"
              echo "SHA256: $SHA256"
              echo "SHA512: $SHA512"
              echo
            } >> "$OUT/Packages"
          done

          gzip -9c "$OUT/Packages" > "$OUT/Packages.gz"
          bzip2 -9c "$OUT/Packages" > "$OUT/Packages.bz2"

          DATE_RFC2822="$(LC_ALL=C date -R)"
          {
            echo "Origin: Rashad Repo"
            echo "Label: Rashad Repo"
            echo "Suite: stable"
            echo "Version: 1.1"
            echo "Codename: ios"
            echo "Date: $DATE_RFC2822"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: Rashad's Sileo repository for rootless jailbreak packages"
            echo "MD5Sum:"
            for FILE in Packages Packages.gz Packages.bz2; do
              HASH="$(md5 -q "$OUT/$FILE")"
              SIZE="$(stat -f%z "$OUT/$FILE")"
              printf " %s %16s %s\n" "$HASH" "$SIZE" "$FILE"
            done
            echo "SHA256:"
            for FILE in Packages Packages.gz Packages.bz2; do
              HASH="$(shasum -a 256 "$OUT/$FILE" | awk '{print $1}')"
              SIZE="$(stat -f%z "$OUT/$FILE")"
              printf " %s %16s %s\n" "$HASH" "$SIZE" "$FILE"
            done
          } > "$OUT/Release"

          cat > "$OUT/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Rashad Repo</title>
            <style>
              body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.55}
              .pkg{padding:14px 0;border-bottom:1px solid #ddd}
              code{word-break:break-all}
            </style>
          </head>
          <body>
            <h1>Rashad Repo</h1>
            <p>Rootless packages for Sileo.</p>
          EOF

          for DEB in "$OUT"/debs/*.deb; do
            NAME="$(dpkg-deb -f "$DEB" Name)"
            VERSION="$(dpkg-deb -f "$DEB" Version)"
            DESC="$(dpkg-deb -f "$DEB" Description)"
            HOMEPAGE="$(dpkg-deb -f "$DEB" Homepage 2>/dev/null || true)"
            {
              echo '<div class="pkg">'
              echo "<h2>$NAME <small>$VERSION</small></h2>"
              echo "<p>$DESC</p>"
              [ -n "$HOMEPAGE" ] && echo "<p><a href=\"$HOMEPAGE\">Source / project page</a></p>"
              echo '</div>'
            } >> "$OUT/index.html"
          done

          cat >> "$OUT/index.html" <<'EOF'
          </body>
          </html>
          EOF

          echo "Repository package index:"
          cat "$OUT/Packages"

      - name: Publish Rashad Repo to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sileo-repo"
          cd "$OUT"

          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish Rashad Repo"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --force origin gh-pages
